name: flake check

# Re-enabled 2026-10-05.
#
# It was disabled on 2026-10-04 because the desktop profile carried a stale
# option, and this turned every push into a red X. Two things have changed:
#
#   1. The stale option is fixed, and every host below has been evaluated
#      against the pinned nixpkgs — not assumed to work.
#   2. Worse, *disabling* it did not make the red X go away. A workflow file
#      with its `on:` and `jobs:` commented out is not a disabled workflow, it
#      is an invalid one, and Actions reports it as a failed run in 0s on
#      every push. Five of them were in the history before this commit. If you
#      want this switched off, delete this file.
#
# Evaluation only, no building. That is deliberate: it catches the mistakes
# that actually happen when a config is edited by hand — an option name that
# does not exist, a value of the wrong type, an attribute declared in two
# modules, a relative path one level too deep — in a few minutes and with no
# cache churn. A full build test would be the next thing to add, and it would
# need a builder that is not a GitHub runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            accept-flake-config = true
      # flake check evaluates every entry of nixosConfigurations, so this one
      # command already covers the whole host list. The step after it exists
      # only so that a failure says which machine it came from.
      - name: flake check
        run: nix flake check --no-build

      - name: every host has a derivation
        run: |
          set -euo pipefail
          for host in $(nix eval --raw --apply builtins.attrNames .#nixosConfigurations); do
            printf '  %-14s ' "$host"
            if nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath" >/dev/null; then
              echo ok
            else
              echo FAIL
              exit 1
            fi
          done

      # These are what a person runs by hand from the README, so they are worth
      # actually building rather than evaluating. The formatter is not in this
      # list: it lives at formatter.<system>, so `.#formatter` is an attrset now
      # and `nix build` rejects it
      #   error: flake output attribute 'formatter' is not a derivation or path
      # `nix flake check` checks that output (and all seven nixosConfigurations,
      # packages and devShells) anyway, and the step below runs the formatter.
      - name: build the standalone packages
        run: nix build --no-link .#astra-boot .#astra-info

      # The tree is formatted with alejandra, the formatter this flake declares.
      # Cheap, and it means the first person to hand-edit a file cannot leave it
      # half-done.
      - name: the tree matches its declared formatter
        run: nix fmt -- --check .