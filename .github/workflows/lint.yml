name: lint

# The only CI in this repo that can run green today.
#
# check.yml was disabled because building every host took twenty minutes and was
# reliably red. It is enabled again now that the option it tripped over is fixed
# and every host has been evaluated against the pinned nixpkgs. These three
# checks need no nix, no NixOS and no network, and they catch the mistakes that
# actually happen when a config is edited by hand: unbalanced braces, two
# modules claiming one attribute, a host list that has drifted, and a boot state
# machine that quietly does the wrong thing.
#
# Delete this file if you would rather not have CI at all — it is one command.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nix-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Validated against the pre-refactor files as well as the current ones, so
      # a false positive here shows up as a failure of the checker itself.
      - name: brackets and strings balance
        run: python3 .ci/nix-balance.py .
      - name: no attribute claimed by two modules with different values
        run: python3 .ci/nix-conflicts.py .
      # flake.nix and install.sh each list the machines by hand. install.sh runs
      # `nixos-rebuild --flake .#<host>`, so a host it offers but the flake
      # cannot build is a bad morning for whoever is holding the laptop.
      - name: flake.nix, install.sh and CI agree on the host list
        run: python3 .ci/host-list.py .

  boot-state-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Exercises modules/boot/bin/astra-boot against a fake /nix store: no nix,
      # no root, two seconds. This is the piece of astra where a logic bug is
      # silent until a machine reboots itself into the wrong system.
      - name: astra-boot
        run: bash .ci/astra-boot-test.sh

  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every shell script parses
        run: |
          find . -name '*.sh' -not -path './.git/*' -exec bash -n {} \;
          bash -n modules/boot/bin/astra-boot